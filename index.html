<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To Do List</title>
  <link rel="stylesheet" href="style.css">    
</head>
<body>
  <div class="card">
    <h1>My To-Do List</h1>
    <div class="input-row">
      <input id="taskInput" type="text" placeholder="Enter your Tasks to be Done...">  
      <button id="addBtn">Add</button>
    </div>
    <p id="error"></p>
    <ul id="list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
